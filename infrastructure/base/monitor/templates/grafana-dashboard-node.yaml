                          "172.21.10.12:9100": {
                            "index": 2,
                            "text": "worker-02"
                          }
                        },
                        "type": "value"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Usage"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "basic",
                      "type": "gauge",
                      "valueDisplayMode": "color"
                    }
                  },
                  {
                    "id": "unit",
                    "value": "percent"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "MountPoint"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 150
