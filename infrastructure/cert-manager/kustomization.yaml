apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager

resources:
  - ../../modules/platform/cert-manager
  - secret.yaml
  - values.yaml

patches:
  - target:
      kind: HelmRelease
      name: cert-manager
    patch: |
      - op: add
        path: /spec/releaseName
        value: cert-manager
      - op: add
        path: /spec/targetNamespace
        value: cert-manager

      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: cert-manager-values
          valuesKey: cert-manager-values.yaml
