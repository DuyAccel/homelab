apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../modules/infrastructure/authen
  - namespace.yaml
  - values.yaml

patches:
  - target:
      kind: HelmRelease
      name: keycloakx
    patch: |
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: authen-values-base
          valuesKey: values.yaml
