---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-values
data:
  cilium-values.yaml: |-
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList:
          - 10.32.0.0/12
        clusterPoolIPv4MaskSize: 24

    ipv4:
      enabled: true
    ipv6:
      enabled: false
    gatewayAPI:
      enabled: false
    envoy:
      enabled: false
    cni:
      exclusive: false

    kubeProxyReplacement: true
    k8sServiceHost: 192.168.10.50
    k8sServicePort: 6443

    operator:
      replicas: 1
    socketLB:
      enabled: true
      hostNamespaceOnly: true
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true
    loadBalancer:
      algorithm: maglev
    bpf:
      masquerade: false
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
