apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: env-staging
  namespace: flux-system
spec:
  interval: 5m

  path: ./stacks/staging
  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  wait: true
  timeout: 5m
  serviceAccountName: flux-deployer
  decryption:
    provider: sops
    secretRef:
      name: sops-age
