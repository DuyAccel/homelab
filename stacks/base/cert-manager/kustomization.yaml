apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../modules/platform/cert-manager
  - values.yaml

patches:
  - target:
      kind: HelmRelease
      name: cert-manager
    patch: |
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: values-base
          valuesKey: values.yaml
