---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: codecentric
  namespace: flux-system
spec:
  interval: 1h0m0s
  type: oci
  url: oci://ghcr.io/codecentric/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloakx
  namespace: flux-system
spec:
  chart:
    spec:
      chart: keycloax
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: codecentric
      version: 7.1.5
  interval: 30m0s
  valuesFrom:
    - kind: ConfigMap
      name: cluster-authen-values
      valuesKey: values.yaml
