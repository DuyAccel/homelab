apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager

resources:
  - ../../base/cert-manager
  - secret.yaml
  - cluster-issuer.yaml

patches:
  - target:
      kind: HelmRelease
      name: cert-manager
    patch: |
      - op: add
        path: /spec/releaseName
        value: cert-manager
      - op: add
        path: /spec/targetNamespace
        value: cert-manager
