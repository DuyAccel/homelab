                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "172.21.10.10:9100"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "master-01"
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "purple",
