---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability-stack
spec:
  interval: 10m
  chart:
    spec:
      chart: tempo
      version: ">= 1.7.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Cấu hình Single Binary cho Tempo
    tempo:
      repository: grafana/tempo
      retention: 72h
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn
    serviceAccount:
      create: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: tempo
            patch: |-
              - op: add
                path: /metadata/labels/istio.io~1global
                value: "true"
