          ],
          "title": "File System Usage (%)",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "instance": false
                },
                "includeByName": {},
                "indexByName": {},
                "renameByName": {
                  "Value": "Usage",
                  "instance": "Server",
                  "mountpoint": "MountPoint"
                }
              }
            }
          ],
          "type": "table"
