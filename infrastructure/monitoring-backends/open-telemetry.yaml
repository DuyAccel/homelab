---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: observability-stack
spec:
  interval: 10m
  releaseName: otel-collector
  # Chart phát hành dạng OCI trên GHCR: open-telemetry/opentelemetry-helm-charts/opentelemetry-collector
  chartRef:
    kind: OCIRepository
    name: opentelemetry-collector
    namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    mode: deployment
    image:
      repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib"
    command:
      name: otelcol-contrib
    replicaCount: 1
    fullnameOverride: otel-collector
    clusterRole:
      create: true
      rules:
        - apiGroups: [""]
          resources:
            - pods
            - namespaces
            - nodes
          verbs: ["get", "list", "watch"]

        - apiGroups: ["apps"]
          resources:
            - deployments
            - replicasets
            - statefulsets
            - daemonsets
          verbs: ["get", "list", "watch"]

    ports:
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
      grpc-otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        protocol: TCP
      http-otlp:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        protocol: TCP
      http-metrics:
        enabled: true
        containerPort: 8888
        servicePort: 8888

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

    # alternateConfig thay thế hoàn toàn config mặc định của chart
    alternateConfig:
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 400
          spike_limit_mib: 100

        k8sattributes:
          auth_type: serviceAccount
          passthrough: false
          extract:
            metadata:
              - k8s.namespace.name
              - k8s.pod.name
              - k8s.deployment.name
              - k8s.node.name

        tail_sampling:
          decision_wait: 10s
          num_traces: 50000
          expected_new_traces_per_sec: 100
          policies:
            - name: keep-all-failures-100
              type: and
              and:
                and_sub_policy:
                  - name: error-status
                    type: status_code
                    status_code:
                      status_codes: [ERROR]

            - name: drop-duynch-lab
              type: drop
              drop:
                drop_sub_policy:
                  - name: url-match
                    type: string_attribute
                    string_attribute:
                      key: http.url
                      values:
                        - '.*duynch\.lab.*'
                      enabled_regex_matching: true

            - name: drop-http-4xx
              type: drop
              drop:
                drop_sub_policy:
                  - name: http-4xx
                    type: numeric_attribute
                    numeric_attribute:
                      key: http.response.status_code
                      min_value: 400
                      max_value: 499

            - name: success-10
              type: and
              and:
                and_sub_policy:
                  - name: success-status
                    type: status_code
                    status_code:
                      status_codes: [OK, UNSET]
                  - name: success-rate
                    type: probabilistic
                    probabilistic:
                      sampling_percentage: 10

        batch:
          send_batch_size: 8192
          timeout: 2s

      connectors:
        # Sinh span metrics + exemplars (trace_id) tại collector
        spanmetrics:
          namespace: traces_spanmetrics
          histogram:
            unit: s
            explicit:
              buckets:
                - 2ms
                - 4ms
                - 6ms
                - 8ms
                - 10ms
                - 50ms
                - 100ms
                - 200ms
                - 400ms
                - 800ms
                - 1s
                - 1400ms
                - 2s
                - 5s
                - 10s
                - 15s
          dimensions:
            - name: http.method
              default: GET
            - name: http.status_code
            - name: k8s.namespace.name
          exemplars:
            enabled: true

      exporters:
        otlp/tempo:
          endpoint: tempo.observability-stack.svc.cluster.local:4317
          tls:
            insecure: true

        prometheusremotewrite/victoriametrics:
          endpoint: http://victoria-metrics-victoria-metrics-single-server.observability-stack.svc.cluster.local:8428/api/v1/write
          send_exemplars: true
          timeout: 30s

      service:
        extensions: [health_check]
        telemetry:
          logs:
            level: info
          metrics:
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, k8sattributes, tail_sampling, batch]
            exporters: [spanmetrics, otlp/tempo]
          metrics/spanmetrics:
            receivers: [spanmetrics]
            processors: [batch]
            exporters: [prometheusremotewrite/victoriametrics]
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: otel-collector
            patch: |-
              - op: add
                path: /metadata/labels/istio.io~1global
                value: "true"
