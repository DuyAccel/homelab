apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability-stack
configMapGenerator:
  - name: grafana-dashboard-pod-inventory
    files:
      - pod-inventory-dashboard.json
      - servers-overview.json
      - log-explorer.json
    options:
      labels:
        grafana_dashboard: "1"
