apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iam-staging

resources:
  - ../../base/authen
  - values.yaml
  - secret.yaml
nameSuffix: -staging

patches:
  - target:
      kind: HelmRelease
      name: keycloakx
    patch: |
      - op: add
        path: /spec/releaseName
        value: keycloakx
      - op: add
        path: /spec/targetNamespace
        value: iam-staging

      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: authen-values-base-staging
          valuesKey: values.yaml
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: authen-values-staging
          valuesKey: values.yaml
