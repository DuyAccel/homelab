apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-gateway
  namespace: ingress-external
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              networking-zone: external
    - name: https-wildcard
      hostname: "*.duynch.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: duynch.com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              networking-zone: external
    - name: https-root
      hostname: "duynch.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: duynch.com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              networking-zone: external
    - name: https-khoanguyen
      hostname: "khoanguyen.io.vn"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: khoanguyen.io-vn-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              networking-zone: external
