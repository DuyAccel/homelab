---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: observability-stack
spec:
  interval: 10m
  chart:
    spec:
      chart: k8s-monitoring
      version: ">= 1.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    cluster:
      name: homelab

    global:
      # Tối ưu metrics: giảm tần suất cào dữ liệu xuống 120s để tiết kiệm CPU/RAM và dung lượng
      scrapeInterval: 120s

    destinations:
      victoriametrics:
        type: prometheus
        url: http://victoria-metrics-victoria-metrics-single-server.observability-stack.svc.cluster.local:8428/api/v1/write
      loki:
        type: loki
        url: http://loki-gateway.observability-stack.svc.cluster.local:80/loki/api/v1/push
      tempo:
        type: otlp
        url: http://tempo.observability-stack.svc.cluster.local:4317
        protocol: grpc

    clusterMetrics:
      enabled: true
      collector: alloy-metrics
      destinations: [victoriametrics]
      cadvisor:
        metricsTuning:
          includeMetrics:
            - machine_cpu_cores

    telemetryServices:
      kube-state-metrics:
        deploy: true
      # ksm:
      #   enabled: true
    nodeMetrics:
      enabled: true
      collector: alloy-metrics
      destinations: [victoriametrics]

    podLogsViaLoki:
      enabled: true
      collector: alloy-logs
      destinations: [loki]

    applicationObservability:
      enabled: true
      collector: alloy-metrics
      destinations: [tempo]
      receivers:
        otlp:
          grpc:
            enabled: true
            port: 4317
          http:
            enabled: true
            port: 4318

    # Tắt OpenCost vì rất nặng
    costMetrics:
      enabled: false

    # Tối ưu hóa bộ phận thu thập (Alloy)
    collectors:
      alloy-metrics:
        enabled: true
        presets: [clustered]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      alloy-logs:
        enabled: true
        presets: [filesystem-log-reader]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
