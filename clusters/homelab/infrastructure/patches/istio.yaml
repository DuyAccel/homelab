apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-istiod
  namespace: istio-system
spec:
  values:
    global:
      meshID: duynch-mesh
      multiCluster:
        clusterName: homelab
      network: network-homelab
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ztunnel
  namespace: istio-system
spec:
  values:
    multiCluster:
      clusterName: homelab
    global:
      network: network-homelab
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    topology.istio.io/network: network-homelab
