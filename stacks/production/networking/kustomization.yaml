apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: networking-stack

resources:
  - ../../base/networking
  - netpol.yaml
  - values.yaml

patches:
  - target:
      kind: HelmRelease
      name: cilium
    patch: |
      - op: add
        path: /spec/releaseName
        value: cilium
      - op: add
        path: /spec/targetNamespace
        value: networking-stack
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: networking-values-prod
          valuesKey: cilium-values.yaml
