---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  releaseName: cilium
  targetNamespace: kube-system
  chartRef:
    kind: OCIRepository
    name: cilium
    namespace: flux-system
  interval: 72h
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: cilium-values.yaml
