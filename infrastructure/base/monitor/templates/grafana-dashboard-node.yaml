            {
              "editorMode": "code",
              "expr": "100 *\r\n(\r\n  1 -\r\n    avg by (instance) (\r\n    rate(\r\n      node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m]\r\n    )\r\n  )\r\n)",
              "legendFormat": "__auto",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "CPU Usage (%)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
