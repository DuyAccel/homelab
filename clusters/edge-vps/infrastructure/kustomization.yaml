apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure/namespaces.yaml
  - ../../../infrastructure/istio
  - ../../../infrastructure/cert-manager
  - ../../../infrastructure/monitoring-collector
  - edge-vps-cacerts.yaml
patches:
  - target:
      kind: HelmRelease
      name: istio-istiod
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: istio-istiod
      spec:
        values:
          global:
            meshID: duynch-mesh
            multiCluster:
              clusterName: edge-vps
            network: network-edge
  - target:
      kind: HelmRelease
      name: istio-ztunnel
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: istio-istiod
      spec:
        values:
          multiCluster:
            clusterName: edge-vps
          global:
            network: network-edge
  - target:
      kind: Namespace
      name: istio-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: istio-system
        labels:
          topology.istio.io/network: network-edge
  - target:
      kind: HelmRelease
      name: k8s-monitoring
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: k8s-monitoring
      spec:
        values:
          cluster:
            name: edge-vps
  - target:
      kind: Namespace
      name: istio-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: observability-stack
        labels:
          topology.istio.io/network: network-edge
