---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability-stack
spec:
  parentRefs:
    - name: http-gateway
      namespace: ingress-internal
  hostnames:
    - monitoring.duynch.lab
  rules:
    - backendRefs:
        - name: grafana
          port: 80
