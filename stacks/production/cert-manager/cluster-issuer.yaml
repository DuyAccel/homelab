---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudflare-duynch.com
spec:
  acme:
    privateKeySecretRef:
      name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              key: api-token
              name: cloudflare-apitoken-secret
            email: nguyenchauhieuduy@outlook.com
        selector:
          dnsNames:
            - duynch.com
            - "*.duynch.com"
