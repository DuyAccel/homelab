apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database

nameSuffix: -prod
resources:
  - ../../base/postgresql

patches:
  - target:
      kind: Cluster
      group: postgresql.cnpg.io
      name: postgresql
    patch: |
      - op: replace
        path: /spec/instances
        value: 1

      - op: replace
        path: /spec/storage/size
        value: 15Gi
      - op: replace
        path: /spec/walStorage/size
        value: 5Gi
