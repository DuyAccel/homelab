apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../modules/infrastructure/cilium
  - values.yaml

patches:
  - target:
      kind: HelmRelease
      name: cilium
    patch: |
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: networking-values-base
          valuesKey: cilium-values.yaml
