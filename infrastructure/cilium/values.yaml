---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-values
data:
  cilium-values.yaml: |-
    cni:
      confPath: /var/lib/rancher/k3s/agent/etc/cni/net.d
      exclusive: false
      hostConfDirMountPath: /host/var/lib/rancher/k3s/agent/etc/cni/net.d
    ipam:
      operator:
        clusterPoolIPv4MaskSize: 24
        clusterPoolIPv4PodCIDRList:
          - 10.42.0.0/16
    ipv4:
      enabled: true
    ipv6:
      enabled: false
    kubeProxyReplacement: true
    operator:
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/control-plane: "true"
      replicas: 1
    socketLB:
      enabled: true
      hostNamespaceOnly: true

    gatewayAPI:
      enabled: false
    nodePort:
      addresses:
        - 160.191.175.165/32
      enabled: true
    devices: private-cloud
