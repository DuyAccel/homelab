{{- range .Values.customGateway.gateways }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .name }}
  {{- if .annotations }}
  annotations:
{{ toYaml .annotations | indent 4 }}
  {{- end }}

spec:
  gatewayClassName: istio

  {{- if .infrastructure }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ .infrastructure }}
  {{- end }}

  listeners:
  {{- range .listeners }}
    - name: {{ .name }}
      port: {{ .port }}
      protocol: {{ .protocol }}
      {{- if .hostname }}
      hostname: {{ .hostname | quote }}
      {{- end }}

      {{- if eq .protocol "HTTPS" }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .tlsSecret }}
      {{- end }}

      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes-service.exposed-to
                operator: In
                values: {{ toYaml .routeExposure | nindent 18 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-istio
  labels:
    gateway.networking.k8s.io/gateway-name: {{ .name }}
    istio.io/dataplane-mode: none

spec:
  type: {{ .service.type | default "ClusterIP" }}
  externalTrafficPolicy: {{ .service.externalTrafficPolicy | default "Cluster" }}

  selector:
    gateway.networking.k8s.io/gateway-name: {{ .name }}

  ports:
  {{- range .service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .port}}
      {{- if .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
  {{- end }}

---
  {{- if .redirectHTTPToHTTPS }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-http2https
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .name }}
    sectionName: http2
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301

  {{- end }}
---
{{- end }}
