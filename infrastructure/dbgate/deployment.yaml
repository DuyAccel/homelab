apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbgate
  template:
    metadata:
      labels:
        app: dbgate
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: dbgate
          image: dbgate/dbgate:7.1.12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: LOGIN
              valueFrom:
                secretKeyRef:
                  name: dbgate-secret
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dbgate-secret
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /root/.dbgate
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dbgate-data
