---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  releaseName: openebs
  targetNamespace: openebs
  chart:
    spec:
      chart: openebs
      version: "4.4.0"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  interval: 72h
  values:
    localpv-provisioner:
      localpv:
        basePath: /var/local/openebs
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      hostpathClass:
        enabled: true
        name: openebs-hostpath
        reclaimPolicy: Delete
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
        rawfile:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false

