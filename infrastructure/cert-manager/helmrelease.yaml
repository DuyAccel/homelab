---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  releaseName: cert-manager
  targetNamespace: cert-manager
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: flux-system
  interval: 72h
  valuesFrom:
    - kind: ConfigMap
      name: cert-manager-values
      valuesKey: cert-manager-values.yaml
