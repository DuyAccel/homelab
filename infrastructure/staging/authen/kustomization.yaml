apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cluster-authentication

resources:
  - ../../base/authen
  - values.yaml
  - pvc.yaml

patches:
  - target:
      kind: HelmRelease
      name: keycloakx
    patch: |
      - op: add
        path: /spec/releaseName
        value: internal-authen
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: cluster-authen-values-staging
          valuesKey: values.yaml
