          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (instance) (\r\n  rate(node_disk_read_bytes_total{job=\"node-exporter\"}[5m])\r\n  +\r\n  rate(node_disk_written_bytes_total{job=\"node-exporter\"}[5m])\r\n)",
