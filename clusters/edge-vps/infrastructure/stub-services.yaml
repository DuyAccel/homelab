apiVersion: v1
kind: Service
metadata:
  name: loki-gateway
  namespace: observability-stack
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics-victoria-metrics-single-server
  namespace: observability-stack
spec:
  ports:
  - name: http
    port: 8428
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability-stack
spec:
  ports:
  - name: grpc-otlp
    port: 4317
    protocol: TCP
  - name: http-otlp
    port: 4318
    protocol: TCP
  - name: http-query
    port: 3200
    protocol: TCP
