---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability-stack
spec:
  interval: 10m
  chart:
    spec:
      chart: tempo
      version: ">= 1.7.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Cấu hình Single Binary cho Tempo — S3-backed (Garage)
    tempo:
      repository: grafana/tempo
      retention: 720h   # 30 ngày, S3 rẻ hơn PVC nhiều
      reportingEnabled: false
      extraArgs:
        "config.expand-env": "true"   # Bung ${VAR} trong storage config
      extraEnv:
        - name: TEMPO_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tempo-s3-credentials
              key: access-key
        - name: TEMPO_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tempo-s3-credentials
              key: secret-key
      storage:
        trace:
          backend: s3
          wal:
            path: /var/tempo/wal       # WAL vẫn nằm trên PVC
          s3:
            bucket: tempo-traces
            endpoint: garage.garage.svc.cluster.local:3900
            region: garage
            access_key: ${TEMPO_S3_ACCESS_KEY}
            secret_key: ${TEMPO_S3_SECRET_KEY}
            insecure: true             # Garage serve HTTP, không TLS
            forcepathstyle: true       # Bắt buộc cho S3-compatible non-AWS
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    persistence:
      enabled: true
      size: 5Gi        # Chỉ cần cho WAL, traces đã lên S3
      storageClass: longhorn
    serviceAccount:
      create: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: tempo
            patch: |-
              - op: add
                path: /metadata/labels/istio.io~1global
                value: "true"
