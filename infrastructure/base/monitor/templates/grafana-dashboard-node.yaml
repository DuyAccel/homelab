              {
                "matcher": {
                  "id": "byName",
                  "options": "172.21.10.11:9100"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "worker-01"
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "semi-dark-green",
