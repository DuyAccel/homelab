apiVersion: v1
kind: Service
metadata:
  name: external-gateway-nodeport
  namespace: ingress-external
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    gateway.networking.k8s.io/gateway-name: external-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30443
---
apiVersion: v1
kind: Service
metadata:
  name: eastwest-gateway-nodeport
  namespace: istio-system
  labels:
    topology.istio.io/network: network-edge
spec:
  type: NodePort
  externalTrafficPolicy: Local
  externalIPs:
    - 172.21.10.10
  selector:
    gateway.networking.k8s.io/gateway-name: eastwest-gateway
  ports:
    - name: mesh
      port: 15008
      targetPort: 15008
      nodePort: 31008
