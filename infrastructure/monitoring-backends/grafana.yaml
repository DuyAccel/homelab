---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: observability-stack
spec:
  interval: 10m
  chart:
    spec:
      chart: grafana
      version: ">= 8.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 5Gi
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            uid: victoriametrics
            url: http://victoria-metrics-victoria-metrics-single-server.observability-stack.svc.cluster.local:8428
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.observability-stack.svc.cluster.local:3100
            access: proxy
          - name: Tempo
            type: tempo
            uid: tempo
            url: http://tempo.observability-stack.svc.cluster.local:3200
            access: proxy
            jsonData:
              httpMethod: GET
              tracesToLogsV2:
                datasourceUid: "loki"
                spanStartTimeShift: "-1h"
                spanEndTimeShift: "1h"
                tags:
                  [
                    { key: "service.name", value: "service" },
                    { key: "host.name", value: "host" },
                  ]
                filterByTraceID: true
                filterBySpanID: true
              tracesToMetrics:
                datasourceUid: "victoriametrics"
                spanStartTimeShift: "-1h"
                spanEndTimeShift: "1h"
                tags:
                  [
                    { key: "service.name", value: "service" },
                    { key: "host.name", value: "host" },
                  ]
              serviceMap:
                datasourceUid: "victoriametrics"
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: observability-stack
        provider:
          allowUiUpdates: true
