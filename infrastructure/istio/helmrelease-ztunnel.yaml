---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ztunnel
spec:
  releaseName: istio-ztunnel
  targetNamespace: istio-system
  chart:
    spec:
      chart: ztunnel
      version: ">= 1.28.6"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  interval: 72h
  valuesFrom:
    - kind: ConfigMap
      name: istio-values
      valuesKey: ztunnel-values.yaml
