apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: env-edge
  namespace: flux-system
spec:
  interval: 5m
  path: ./stacks/edge
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 5m
  serviceAccountName: flux-deployer
  patches:
    - target:
        kind: Gateway
        name: eastwest-gateway
      patch: |-
        - op: add
          path: /metadata/annotations
          value:
            networking.istio.io/service-type: "ClusterIP"
        - op: add
          path: /spec/addresses
          value:
            - type: IPAddress
              value: 172.21.10.10
    - target:
        kind: Gateway
        name: external-gateway
      patch: |-
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: external-gateway
          annotations:
            networking.istio.io/service-type: ClusterIP
            proxy.istio.io/config: '{"gatewayTopology" : { "proxyProtocol": {} }}'
