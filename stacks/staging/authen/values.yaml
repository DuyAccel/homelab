---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authen-values-staging
data:
  values.yaml: |-
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists

    extraVolumeMounts: |
      - name: keycloak-data
        mountPath: /opt/keycloak/data
    extraVolumes: |
      - name: keycloak-data
        persistentVolumeClaim:
          claimName: keycloak-data

    extraEnvFrom: |
      - secretRef:
          name: keycloakx-secret

    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: internal
          namespace: networking-stack
          sectionName: https
      hostnames:
        - authen.homelab.local
