apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../modules/infrastructure/longhorn
  - values.yaml

patches:
  - target:
      kind: HelmRelease
      name: longhorn
    patch: |
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: storage-values-base
          valuesKey: longhorn-values.yaml
