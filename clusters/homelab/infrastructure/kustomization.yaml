apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure/cilium
  - ../../../infrastructure/namespaces.yaml
  - ../../../infrastructure/istio
  - ../../../infrastructure/gateway-api
  - ../../../infrastructure/longhorn
  - ../../../infrastructure/cert-manager
  - ../../../infrastructure/openebs
  - ../../../infrastructure/garage
  - ../../../infrastructure/cloudnative-pg
  - ../../../infrastructure/dbgate
  - ../../../infrastructure/monitoring-backends
  - ../../../infrastructure/monitoring-collector
  - homelab-cacerts.yaml
patches:
  - target:
      kind: HelmRelease
      name: istio-istiod
    path: patches/patch-istio-istiod.yaml
  - target:
      kind: HelmRelease
      name: istio-ztunnel
    path: patches/patch-istio-ztunnel.yaml
  - target:
      kind: Namespace
      name: istio-system
    path: patches/patch-ns-istio-system.yaml
  - target:
      kind: Namespace
      name: observability-stack
    path: patches/patch-ns-observability-stack.yaml
